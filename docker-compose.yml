services:
  postgres:
    image: postgres:16-alpine
    container_name: clinical-postgres
    environment:
      POSTGRES_USER: clinIQ_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cliniIQ
    ports:
      - "5432:5432"
    volumes:
      - clinical_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinIQ_user -d cliniIQ"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinical_pg_data:
